server.port: 8080
spring:
  application.name: api-gateway
  data.redis:
    host: ${REDIS_HOST:localhost}
    port: 6379
  security.oauth2.resourceserver.jwt.issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8180/realms/restaurant}
  cloud.gateway:
    default-filters:
      - name: RequestRateLimiter
        args:
          redis-rate-limiter.replenishRate: 20
          redis-rate-limiter.burstCapacity: 40
          key-resolver: "#{@userKeyResolver}"
          deny-empty-key: true
    routes:
      - id: order-service
        uri: ${ORDER_URL:http://localhost:8081}
        predicates: [ "Path=/api/orders/**" ]
        filters:
          - RewritePath=/api/(?<seg>.*), /${seg}
      - id: order-query-service
        uri: ${QUERY_URL:http://localhost:8082}
        predicates: [ "Path=/api/query/**" ]
        filters:
          - RewritePath=/api/query/(?<seg>.*), /query/${seg}
management.endpoints.web.exposure.include: health,prometheus
