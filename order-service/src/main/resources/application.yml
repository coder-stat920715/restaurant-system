server.port: 8081
spring:
  application.name: order-service
  threads.virtual.enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/orders}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    open-in-view: false
    hibernate.ddl-auto: none        # schema owned by Flyway
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:29092}
    consumer:
      group-id: order-service-saga
      enable-auto-commit: false
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener.ack-mode: manual
  security.oauth2.resourceserver.jwt.issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8180/realms/restaurant}

saga:
  timeout: PT2M                  # a saga step with no reply for this long is compensated
  timeout-check-interval: PT30S

management.endpoints.web.exposure.include: health,prometheus,circuitbreakers,retries
